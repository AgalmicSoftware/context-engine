[profile.default]
src = "contracts"
test = "foundry/test"
script = "foundry/script"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.24"
sparse_mode = true
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "@openzeppelin/=node_modules/@openzeppelin/",
]
skip = []
fs_permissions = [
  { access = "read-write", path = "./client/src/variables" },
]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 32
