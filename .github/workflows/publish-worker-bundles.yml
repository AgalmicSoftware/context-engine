name: Publish Worker Bundles

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful canonical CI run id to publish
        required: true
        type: string

concurrency:
  group: immutable-worker-release-${{ github.event.workflow_run.head_sha || inputs.run_id }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  publish-worker-bundles:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout trusted publication verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Fetch and validate canonical CI run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id || github.event.workflow_run.id }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          APP_VERSION="$(node -p 'require("./package.json").version')"
          RELEASE_STAMP="$(date -u +'%Y-%m-%d %H:%M UTC')"
          TAG_NAME="worker-bundles-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          RELEASE_NAME="Context Engine ${APP_VERSION} worker bundles (${SHORT_SHA})"
          {
            echo "tag_name=${TAG_NAME}"
            echo "release_name=${RELEASE_NAME}"
            echo "release_stamp=${RELEASE_STAMP}"
            echo "app_version=${APP_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout exact successful CI source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_name }}
          make_latest: true
          body: |
            Automated worker bundle release for Context Engine `${{ steps.meta.outputs.app_version }}` at `${{ github.sha }}` on `${{ github.ref_name }}`.

      - name: Download exact immutable CI artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: worker-bundles-${{ steps.run.outputs.sourceCommit }}
          path: ${{ runner.temp }}/worker-release
          repository: ${{ github.repository }}
          run-id: ${{ steps.run.outputs.runId }}
          github-token: ${{ github.token }}

      - name: Resolve checked-out replay provenance
        id: source
        run: >-
          node scripts/worker-release-artifacts.mjs resolve-source
          --root .
          --commit "${{ steps.run.outputs.sourceCommit }}"
          --github-output "$GITHUB_OUTPUT"

      - name: Verify archive, provenance, source, and checksums
        run: >-
          node scripts/worker-release-artifacts.mjs verify
          --root .
          --artifact-dir "${{ runner.temp }}/worker-release"
          --source-commit "${{ steps.run.outputs.sourceCommit }}"
          --source-ref "${{ steps.run.outputs.sourceRef }}"
          --source-tree "${{ steps.source.outputs.sourceTree }}"
          --repository "${{ github.repository }}"
          --workflow CI
          --run-id "${{ steps.run.outputs.runId }}"
          --run-attempt "${{ steps.run.outputs.runAttempt }}"

      - name: Publish or verify immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.run.outputs.sourceCommit }}
          SOURCE_REF: ${{ steps.run.outputs.sourceRef }}
          RUN_ID: ${{ steps.run.outputs.runId }}
          RUN_ATTEMPT: ${{ steps.run.outputs.runAttempt }}
          SOURCE_TREE: ${{ steps.source.outputs.sourceTree }}
        run: |
          set -euo pipefail
          tag="worker-bundles-${SOURCE_COMMIT}"
          artifact_dir="${RUNNER_TEMP}/worker-release"
          if gh release view "$tag" >/dev/null 2>&1; then
            existing_dir="${RUNNER_TEMP}/existing-worker-release"
            mkdir -p "$existing_dir"
            gh release download "$tag" --dir "$existing_dir"
            node scripts/worker-release-artifacts.mjs verify \
              --root . \
              --artifact-dir "$existing_dir" \
              --source-commit "$SOURCE_COMMIT" \
              --source-ref "$SOURCE_REF" \
              --source-tree "$SOURCE_TREE" \
              --repository "$GITHUB_REPOSITORY" \
              --workflow CI \
              --run-id "$RUN_ID" \
              --run-attempt "$RUN_ATTEMPT"
            for file in "$artifact_dir"/*; do
              cmp --silent "$file" "$existing_dir/$(basename "$file")"
            done
            echo "Immutable release already exists with identical verified assets: $tag"
            exit 0
          fi

          notes="${RUNNER_TEMP}/worker-release-notes.md"
          {
            echo "Immutable Worker bundles produced and verified by canonical CI run ${RUN_ID}."
            echo
            echo "Source commit: \`${SOURCE_COMMIT}\`"
            echo "Source ref: \`${SOURCE_REF}\`"
            echo "Provenance and SHA-256 checksums: \`worker-release-manifest.json\`"
            echo
            echo "This release does not move the protected latest channel."
          } > "$notes"
          gh release create "$tag" \
            "$artifact_dir/sessionCorsWorker.bundle.js" \
            "$artifact_dir/deployHelper.bundle.js" \
            "$artifact_dir/agentBridgeWorker.bundle.js" \
            "$artifact_dir/worker-release-manifest.json" \
            --target "$SOURCE_COMMIT" \
            --title "Worker bundles ${SOURCE_COMMIT}" \
            --notes-file "$notes" \
            --latest=false
