name: Publish Worker Bundles

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful canonical CI run id to publish
        required: true
        type: string

concurrency:
  group: immutable-worker-release-${{ github.event.workflow_run.head_sha || inputs.run_id }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  publish-worker-bundles:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout trusted publication verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Fetch and validate canonical CI run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id || github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SELECTED_RUN_ID}" > "${RUNNER_TEMP}/ci-run.json"
          node scripts/worker-release-artifacts.mjs validate-run \
            --run-json "${RUNNER_TEMP}/ci-run.json" \
            --repository "$GITHUB_REPOSITORY" \
            --github-output "$GITHUB_OUTPUT"

      - name: Checkout exact successful CI source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.run.outputs.sourceCommit }}
          fetch-depth: 2

            Published assets:
            - `sessionCorsWorker.bundle.js`
            - `deployHelper.bundle.js`
            - `agentBridgeWorker.bundle.js`

            Generated at: `${{ steps.meta.outputs.release_stamp }}`
          files: |
            dist/sessionCorsWorker.bundle.js
            dist/deployHelper.bundle.js
            dist/agentBridgeWorker.bundle.js
          fail_on_unmatched_files: true
          overwrite_files: true
