name: Publish MCP to npm

on:
  workflow_run:
    branches: [main]
    workflows: [CI]
    types: [completed]

concurrency:
  group: mcp-npm-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.repository == 'AgalmicSoftware/context-engine' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout trusted publication verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Preserve trusted verifier
        run: cp scripts/publish-mcp.mjs scripts/mcp-release-artifacts.mjs "$RUNNER_TEMP/"

      - name: Setup publication runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0
          # npm 11.9.0 is bundled; no dependency install or release cache.

      - name: Validate canonical CI run and current main
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node "$RUNNER_TEMP/publish-mcp.mjs" validate-run

      - name: Checkout exact tested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.run.outputs.sourceCommit }}
          persist-credentials: false

      - name: Download the tested tarball from this CI attempt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mcp-package-${{ steps.run.outputs.sourceCommit }}-${{ steps.run.outputs.runAttempt }}
          path: ${{ runner.temp }}/mcp-release
          repository: AgalmicSoftware/context-engine
          run-id: ${{ steps.run.outputs.runId }}
          github-token: ${{ github.token }}

      - name: Verify package and publication decision
        if: vars.MCP_NPM_PUBLISH_ENABLED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/publish-mcp.mjs" publish --dry-run

      - name: Publish verified tarball with npm Trusted Publishing
        if: vars.MCP_NPM_PUBLISH_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MCP_NPM_PUBLISH_ENABLED: ${{ vars.MCP_NPM_PUBLISH_ENABLED }}
        run: node "$RUNNER_TEMP/publish-mcp.mjs" publish --publish
