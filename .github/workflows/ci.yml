name: CI

on:
  push:
    branches:
      - master
      - main
      - 'release-staging*'
      - 'release-staging/**'
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  wiring-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            workers/sessionCorsWorker/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Install sessionCorsWorker dependencies
        run: npm --prefix workers/sessionCorsWorker ci

      - name: Resolve baseline growth approval
        id: baseline-growth-approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASELINE_GROWTH_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/resolve-baseline-growth-approval.mjs

      - name: Resolve baseline monotonicity base
        id: baseline-monotonicity-base
        env:
          BASELINE_EVENT_NAME: ${{ github.event_name }}
          BASELINE_REF_NAME: ${{ github.ref_name }}
          BASELINE_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASELINE_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          node scripts/resolve-baseline-monotonicity-base.mjs --github-output "$GITHUB_OUTPUT"

      - name: Check baseline monotonicity
        env:
          BASELINE_MONOTONICITY_BASE: ${{ steps.baseline-monotonicity-base.outputs.base_sha }}
          BASELINE_MONOTONICITY_APPROVED: ${{ steps.baseline-growth-approval.outputs.approved }}
        run: |
          set -euo pipefail
          node scripts/check-baseline-monotonicity.mjs \
            --base "$BASELINE_MONOTONICITY_BASE" \
            --require-base-sha \
            --approval "$BASELINE_MONOTONICITY_APPROVED"

      - name: Run wiring and release gate
        run: npm run ci:gate -- wiring-and-release

      - name: Run public text gate
        run: npm run ci:gate -- public-text

      - name: Stage tested Worker bundle candidate
        run: >-
          node scripts/worker-release-artifacts.mjs stage
          --dist dist
          --output "${{ runner.temp }}/worker-bundle-candidate"

      - name: Verify release-staging version advancement
        if: ${{ startsWith(github.ref_name, 'release-staging') || startsWith(github.head_ref, 'release-staging') }}
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RELEASE_PUSH_BEFORE_SHA: ${{ github.event.before }}
          ZERO_OID: 0000000000000000000000000000000000000000
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          release_candidate_ref=HEAD
          if [ "$RELEASE_EVENT_NAME" = "pull_request" ]; then
            release_candidate_ref="$RELEASE_PR_HEAD_SHA"
            git fetch --no-tags origin "$release_candidate_ref"
          fi
          git fetch --force --tags origin
          node scripts/worker-release-artifacts.mjs verify-replay-range \
            --base-ref origin/main \
            --candidate-ref "$release_candidate_ref"
          verify_args=(verify-ref --candidate-ref "$release_candidate_ref" --baseline-ref origin/main)
          if [ "$RELEASE_EVENT_NAME" = "push" ] && [ "$RELEASE_PUSH_BEFORE_SHA" != "$ZERO_OID" ]; then
            git fetch --no-tags origin "$RELEASE_PUSH_BEFORE_SHA"
            verify_args+=(--minimum-ref "$RELEASE_PUSH_BEFORE_SHA")
          fi
          node scripts/release-version.mjs "${verify_args[@]}"

      - name: Upload tested Worker bundle candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: worker-bundle-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/worker-bundle-candidate
          if-no-files-found: error
          retention-days: 1

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: stable

      - name: Install root dependencies
        run: npm ci

      - name: Run contracts gate
        run: npm run ci:gate -- contracts

  client:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Run client gate
        run: npm run ci:gate -- client

      - name: Upload client coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-coverage
          path: client/coverage/lcov.info
          if-no-files-found: warn

  root-jest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            workers/sessionCorsWorker/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Install sessionCorsWorker dependencies
        run: npm --prefix workers/sessionCorsWorker ci

      - name: Run root Jest gate
        run: npm run ci:gate -- root-jest

  workers:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/sessionCorsWorker/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install sessionCorsWorker dependencies
        run: npm --prefix workers/sessionCorsWorker ci

      - name: Run Worker gates
        run: npm run ci:gate -- workers

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build client
        run: npm --prefix client run build

      # Quarantine policy: keep this job to stable public smoke routes. If a route
      # flakes, file the failure with evidence before narrowing the route set.
      - name: Run tracked E2E smoke
        env:
          BASE_URL: http://127.0.0.1:4173
          SMOKE_ROUTES: /session/pe4,/about,/contracts
        run: |
          set -euo pipefail
          npm --prefix client run preview -- --host 127.0.0.1 --port 4173 > /tmp/context-engine-vite-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl -fs "$BASE_URL" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS "$BASE_URL" >/dev/null
          npm run ci:gate -- e2e-smoke

  cecc-and-node:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/sessionCorsWorker/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install sessionCorsWorker dependencies
        run: npm --prefix workers/sessionCorsWorker ci

      - name: Run Context Engine CC and Node gate
        run: npm run ci:gate -- cecc-and-node

      - name: Run dead export advisory
        continue-on-error: true
        run: npm run dead-exports:advisory

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - wiring-and-release
      - contracts
      - client
      - root-jest
      - workers
      - e2e-smoke
      - cecc-and-node
    if: ${{ always() }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Check split CI job results
        env:
          CI_GATE_RESULTS_JSON: >-
            {"wiring-and-release":"${{ needs.wiring-and-release.result }}","public-text":"${{ needs.wiring-and-release.result }}","contracts":"${{ needs.contracts.result }}","client":"${{ needs.client.result }}","root-jest":"${{ needs.root-jest.result }}","workers":"${{ needs.workers.result }}","e2e-smoke":"${{ needs.e2e-smoke.result }}","cecc-and-node":"${{ needs.cecc-and-node.result }}"}
        run: npm run ci:gates:check-hosted

      - name: Download tested Worker bundle candidate
        if: ${{ github.event_name == 'push' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: worker-bundle-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/worker-release

      - name: Resolve private-to-public replay provenance
        if: ${{ github.event_name == 'push' }}
        id: worker-source
        run: >-
          node scripts/worker-release-artifacts.mjs resolve-source
          --root .
          --commit "${{ github.sha }}"
          --github-output "$GITHUB_OUTPUT"

      - name: Create and verify immutable Worker artifact manifest
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          npm_version="$(npm --version)"
          node scripts/worker-release-artifacts.mjs create \
            --root . \
            --artifact-dir "${{ runner.temp }}/worker-release" \
            --source-commit "${{ github.sha }}" \
            --source-ref "${{ github.ref }}" \
            --source-tree "${{ steps.worker-source.outputs.sourceTree }}" \
            --repository "${{ github.repository }}" \
            --private-source-commit "${{ steps.worker-source.outputs.privateSourceCommit }}" \
            --public-replay-commit "${{ steps.worker-source.outputs.publicReplayCommit }}" \
            --workflow "${{ github.workflow }}" \
            --workflow-ref "${{ github.workflow_ref }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --npm-version "$npm_version"
          node scripts/worker-release-artifacts.mjs verify \
            --root . \
            --artifact-dir "${{ runner.temp }}/worker-release" \
            --source-commit "${{ github.sha }}" \
            --source-ref "${{ github.ref }}" \
            --source-tree "${{ steps.worker-source.outputs.sourceTree }}" \
            --repository "${{ github.repository }}" \
            --workflow "${{ github.workflow }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}"

      - name: Upload immutable Worker release artifact
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: worker-bundles-${{ github.sha }}
          path: ${{ runner.temp }}/worker-release
          if-no-files-found: error
          retention-days: 30
