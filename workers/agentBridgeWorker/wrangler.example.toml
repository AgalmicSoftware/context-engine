# Developer fallback only. Product/operator setup should use deploy:apply, which
# creates resources, uploads the Worker, and writes secrets through Cloudflare API.
# Copy this file to wrangler.toml only for manual private demo debugging.

name = "ce-agent-bridge-worker"
main = "worker.js"
compatibility_date = "2024-09-02"
compatibility_flags = ["nodejs_compat"]

# account_id is intentionally omitted for product setup. /telegram-demo-setup
# derives the account from CLOUDFLARE_API_TOKEN and blocks if multiple accounts
# are visible. Developers may add account_id locally only as a Wrangler fallback.

kv_namespaces = [
  { binding = "AGENT_ACTION_KV", id = "YOUR_SHORT_LIVED_ACTION_KV_NAMESPACE_ID" },
]

# Optional draft lifecycle research metrics (Workers Analytics Engine).
# When bound, the worker writes one data point per draft_created / draft_edited /
# draft_submitted / draft_discarded event: blobs = [event, sessionSlug,
# questionId, source, originSource, controlType, principalFingerprint],
# doubles = [editCount, draftToSubmitMs (-1 when unknown)], index = sessionSlug.
# Leave unbound to disable; all writes are best-effort and never block the flow.
# principalFingerprint is an HMAC-SHA256 pseudonym of the Telegram user id and
# requires the AGENT_BRIDGE_ANALYTICS_SALT secret; without the salt the field
# is empty (an unsalted hash of a small id space would be reversible):
#   npx wrangler secret put AGENT_BRIDGE_ANALYTICS_SALT
# [[analytics_engine_datasets]]
# binding = "AGENT_BRIDGE_ANALYTICS"
# dataset = "ce_agent_bridge_draft_events"

# Optional burst buffer for 500-user smoke/production events. When enabled,
# submit requests are accepted into KV and queued for background settlement.
# Create the queue separately for manual Wrangler debugging.
# [[queues.producers]]
# binding = "AGENT_RESPONSE_QUEUE"
# queue = "ce-agent-bridge-response-submit"
#
# [[queues.consumers]]
# queue = "ce-agent-bridge-response-submit"
# max_batch_size = 25
# max_batch_timeout = 5

# Optional bridge-owned demo doc/artifact storage. The normal live Telegram
# smoke deploy omits these bindings unless AGENT_BRIDGE_ENABLE_DOC_STORAGE=true
# or deploy:apply receives --enable-doc-storage.
[[d1_databases]]
binding = "AGENT_DOCS_D1"
database_name = "ce-agent-docs-private"
database_id = "YOUR_D1_DATABASE_ID"

[[r2_buckets]]
binding = "AGENT_DOCS_R2"
bucket_name = "ce-agent-docs-private"

[vars]
AGENT_BRIDGE_DEPLOYMENT_ID = "local-demo"
AGENT_BRIDGE_PUBLIC_URL = "https://ce-agent-bridge-worker.<workers-subdomain>.workers.dev"
CE_SESSION_WORKER_BASE_URL = "https://<session-worker>.<workers-subdomain>.workers.dev"
DEFAULT_CHAIN_ID = "11155420"
DEFAULT_RPC_URL = "https://op-sepolia-testnet.api.pocket.network"
# Optional additive fallback, not a replacement for DEFAULT_RPC_URL:
# ADDITIONAL_RPC_URL = "https://your-op-sepolia-rpc.example"
# Optional Telegram adapter; leave all Telegram values absent for Wrapped-only deployments.
# TELEGRAM_BRIDGE_ENABLED = "true"
# TELEGRAM_BOT_USERNAME = "YOUR_BOT_USERNAME"
# Default question source is live. Use "fixture" only for local preview/demo copy.
# Mock Telegram preview routes are disabled by default; enable only for local browser/copy testing.
# AGENT_BRIDGE_ENABLE_TELEGRAM_PREVIEW = "true"
# Optional Mini App overrides. Defaults to $AGENT_BRIDGE_PUBLIC_URL/telegram/mini-app.
# AGENT_BRIDGE_MINI_APP_URL = "https://ce-agent-bridge-worker.<workers-subdomain>.workers.dev/telegram/mini-app"
# AGENT_BRIDGE_MINI_APP_AUTH_MAX_AGE_SECONDS = "86400"
# Optional root response export admins for /export_all and /export_allow.
# Use managed Telegram ETH addresses only; leave unset to hide export controls
# and deny export.
# AGENT_BRIDGE_RESPONSE_EXPORT_ALLOWED_ADDRESSES = "0x0000000000000000000000000000000000000000"
# AGENT_BRIDGE_QUESTION_SOURCE = "fixture"
# AGENT_BRIDGE_QUESTION_LIVE_FALLBACK_TIMEOUT_MS = "2500"
# AGENT_BRIDGE_RPC_TIMEOUT_MS = "5000"
# AGENT_BRIDGE_QUESTION_PAYLOAD_TIMEOUT_MS = "2500"
# AGENT_BRIDGE_QUESTION_CACHE_TTL_SECONDS = "300"
# AGENT_BRIDGE_QUESTION_PAYLOAD_CONCURRENCY = "4"
# AGENT_BRIDGE_QUESTION_FOREGROUND_CHUNKS = "1"
# AGENT_BRIDGE_TELEGRAM_API_TIMEOUT_MS = "8000"
# Edge City 2026 demo session policy. Production should set this as the
# Cloudflare `AGENT_BRIDGE_SESSION_POLICY_JSON` env var, not as a secret. Keep
# `ee-26-test` visible while smoke testing; after the organizers/users sessions
# are created, set AGENT_BRIDGE_TELEGRAM_SESSION_CREATED_AFTER to a timestamp
# after the test session's createdAt and before the public sessions' createdAt.
# Non-default sessions without createdAt metadata are hidden while a cutoff is set.
# AGENT_BRIDGE_SESSION_POLICY_JSON = "{\"default\":\"ee-26-organizers\",\"defaultSessionSchedule\":[{\"sessionSlug\":\"ee-26-organizers\",\"until\":\"2026-05-30T00:00:00Z\"},{\"sessionSlug\":\"ee-26-users\",\"from\":\"2026-05-30T00:00:00Z\"}],\"sessions\":[{\"sessionSlug\":\"ee-26-test\",\"sessionName\":\"EE26 Test\",\"telegramOnly\":true,\"telegramBridgeEnabled\":true,\"createdAt\":\"2026-05-29T00:00:00Z\"},{\"sessionSlug\":\"ee-26-organizers\",\"sessionName\":\"EE26 Organizers\",\"telegramOnly\":true,\"telegramBridgeEnabled\":true,\"createdAt\":\"2026-05-29T01:00:00Z\"},{\"sessionSlug\":\"ee-26-users\",\"sessionName\":\"EE26 Users\",\"telegramOnly\":true,\"telegramBridgeEnabled\":true,\"createdAt\":\"2026-05-29T02:00:00Z\"}]}"
# AGENT_BRIDGE_TELEGRAM_SESSION_CREATED_AFTER = "2026-05-29T01:00:00Z"
# Live question scans prefer metadata blockLimits, then SessionCreated for the slug.
# AGENT_BRIDGE_QUESTION_SCAN_START_BLOCK = "0"
# AGENT_BRIDGE_QUESTION_SCAN_END_BLOCK = ""
# Emergency/debug only: allows recent-block fallback when no scoped bounds exist.
# AGENT_BRIDGE_ALLOW_UNSCOPED_QUESTION_SCAN = "1"
AGENT_AI_PROVIDER = "ce_session_policy"
BROADCAST_ENABLED = "true"
AGENT_BRIDGE_DIRECT_SUBMIT_ENABLED = "true"
# Requires AGENT_RESPONSE_QUEUE binding. Leave false for simple smoke deploys.
AGENT_BRIDGE_ASYNC_SUBMIT_ENABLED = "false"
AGENT_BRIDGE_AUTO_FAUCET_ON_JOIN = "true"
# Direct managed Telegram demo submits still require a live
# CE_SESSION_WORKER_BASE_URL, Surveys address config from the linked session,
# AGENT_BRIDGE_SURVEYS_ADDRESS, or the OP Sepolia default, plus
# managedAccountSubmitAllowed=true in AGENT_BRIDGE_SESSION_POLICY_JSON.
# Telegram-visible worker-backed sessions should set telegramOnly=true,
# sessionMode=telegram_only, or Cloudflare question storage without an explicit
# on-chain question mode so ordinary registry sessions are not listed
# accidentally. Set
# either broadcast flag to "false" to force canonical submit-request records
# instead of broadcasting.
# Optional override for session worker auth. Defaults to AGENT_BRIDGE_PUBLIC_URL
# when present, then http://localhost:7391 for local development.
# AGENT_BRIDGE_WORKER_LOGIN_ORIGIN = "https://ce-agent-bridge-worker.<workers-subdomain>.workers.dev"
# AGENT_BRIDGE_SURVEYS_ADDRESS = "0x..."
# Optional low-friction Geo/Hermes onboarding. Prefer SHA-256 hashes of invite
# tokens; the Geo node/link carries the plaintext token and Hermes supplies the
# Telegram user id it observes.
# AGENT_BRIDGE_TRUSTED_ONBOARDING_INVITE_TOKEN_HASHES = "64_HEX_SHA256_OF_INVITE_TOKEN"
# AGENT_BRIDGE_TRUSTED_ONBOARDING_INVITES_JSON = "[{\"tokenHash\":\"64_HEX_SHA256_OF_INVITE_TOKEN\",\"sessionSlug\":\"session-wrapped\",\"label\":\"Session Wrapped\",\"source\":\"geo:session-wrapped\"}]"

# deploy:apply writes these secrets through Cloudflare API. If debugging a
# manual Wrangler deployment, set secrets with Wrangler, never in this file:
#   npx wrangler secret put DEMO_SIGNER_ROOT_SECRET
#   npx wrangler secret put AGENT_BRIDGE_AGENT_API_TOKEN
#   npx wrangler secret put AGENT_BRIDGE_OPENAI_API_KEY
# Telegram-enabled deployments additionally set TELEGRAM_BOT_TOKEN and
# TELEGRAM_WEBHOOK_SECRET; Wrapped-only deployments do not create them.
# Keep CLOUDFLARE_API_TOKEN out of deployed Worker secrets. Use it only from an
# untracked local shell/.env/.dev.vars for deploy planning or apply automation.
