# Canonical Netlify deployment contract. Dashboard settings should only select
# the repository and production branch; build behavior lives here. The client
# deploys Workers from the release pinned in client/src/variables/workerReleasePin.json,
# so the build first verifies that release's assets and digests.
[build]
  base = "client"
  command = "node ../scripts/verify-release-assets.mjs && npm ci && npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/demo/dacc"
  to = "/about"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
