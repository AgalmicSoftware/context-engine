# Canonical Netlify deployment contract. Dashboard settings should only select
# the repository and production branch; build behavior lives here.
[build]
  base = "client"
  command = "npm ci && REACT_APP_CE_CLOUDFLARE_NATIVE_DEPLOY_REPLAY_COMMIT=$COMMIT_REF npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/demo/dacc"
  to = "/about"
  status = 301

# The social preview image moved out of the immutable /assets path.
[[redirects]]
  from = "/assets/img/context-engine-social-preview-square.png"
  to = "/context-engine-social-preview-square.png"
  status = 301

# Missing hashed assets must 404, not get the SPA HTML under a year-long cache header.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# Agents probe /.well-known/ addresses; none exist, so don't answer with the app.
[[redirects]]
  from = "/.well-known/*"
  to = "/404.html"
  status = 404

# Agents read the guide at /skill.md; its file is agent-guide.md.
[[redirects]]
  from = "/skill.md"
  to = "/agent-guide.md"
  status = 200

# Addresses an agent guesses for the guide; the app would answer them with a page
# that is empty until it runs.
[[redirects]]
  from = "/agents"
  to = "/skill.md"
  status = 302

[[redirects]]
  from = "/agents.md"
  to = "/skill.md"
  status = 302

[[redirects]]
  from = "/agent-guide"
  to = "/skill.md"
  status = 302

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
